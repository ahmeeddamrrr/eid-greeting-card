<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>عيدكم مبارك</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#0d1b3e,#050c1a);display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;font-family:'Noto Kufi Arabic',sans-serif}
h1{font-size:clamp(1.5rem,5vw,2.5rem);color:#e8d5a0;margin-bottom:1.5rem;text-align:center;opacity:.9;font-weight:900}
.wrap{position:relative;width:100%;max-width:460px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(201,168,76,.35),0 12px 50px rgba(0,0,0,.6)}
.wrap img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;padding:0 3%}
.pill span{font-family:'Noto Kufi Arabic',sans-serif;font-weight:900;color:#1a1a2e;text-align:center;width:100%;direction:rtl;unicode-bidi:plaintext;white-space:normal;overflow:hidden;text-overflow:ellipsis;word-wrap:break-word}
.pill span.ph{color:#8a90a8;font-weight:400;font-style:italic}
.ctrl{margin-top:1.4rem;width:100%;max-width:460px;display:flex;flex-direction:column;gap:.9rem}
label{font-size:.82rem;color:#e8d5a0;display:block;margin-bottom:.35rem;opacity:.85}
textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);border-radius:12px;padding:.75rem 1rem;color:#fdf8f0;font-family:'Noto Kufi Arabic',sans-serif;font-size:.95rem;font-weight:700}
textarea:focus{border-color:#c9a84c}
textarea::placeholder{color:rgba(253,248,240,.3)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
button{padding:.72rem .4rem;border:none;border-radius:10px;cursor:pointer;font-family:'Noto Kufi Arabic',sans-serif;font-size:.8rem;font-weight:700;transition:opacity .15s,transform .12s}
button:hover{opacity:.85}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
.b1{background:linear-gradient(135deg,#c9a84c,#9a7428);color:#fff;box-shadow:0 4px 14px rgba(201,168,76,.4)}
.b2{background:linear-gradient(135deg,#c0392b,#7b241c);color:#fff;box-shadow:0 4px 14px rgba(192,57,43,.4)}
.b3{background:rgba(255,255,255,.09);border:1px solid rgba(201,168,76,.4);color:#e8d5a0}
canvas{display:none}
</style>
</head>
<body>
<h1>عيدكم مبارك</h1>
<div class="wrap" id="wrap">
  <img id="img" src="data:image/jpeg;base64,/9j/4QBORXhpZgAATU0AKgAAAAgAAwEaAAUAAAABAAAAMgEbAAUAAAABAAAAOgEoAAMAAAABAAIAAAAAAAAALcbAAAAnEAAtxsAAACcQAAAAAP/tAEBQaG90b3Nob3AgMy4wADhCSU0EBgAAAAAABwAGAQEA/9sAhAABBAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQABBAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAf/aAAwDAQACEAMRAA8A9/oooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//2Q=="
  <div class="pill" id="pill">
    <span class="ph" id="pt">اكتب رسالتك أدناه…</span>
  </div>
</div>
<div class="ctrl">
  <div>
    <label for="msg">✦ رسالتك / Your Message</label>
    <textarea id="msg" placeholder="مثال: كل عام وأنتم بخير&#10;Example: Wishing you a blessed Eid"></textarea>
  </div>
  <div class="btns">
    <button class="b1" id="bPng" style="grid-column:1/-1">⬇ تحميل الكارت</button>
  </div>
</div>
<canvas id="cvs"></canvas>
<script>
// ── White pill exact position (measured from 1080×1350 image pixels) ──
const P={cx:820/1080, cy:624/1350, w:405/1080, h:42/1350};

const img=document.getElementById('img');
const pill=document.getElementById('pill');
const pt=document.getElementById('pt');
const msg=document.getElementById('msg');
const cvs=document.getElementById('cvs');
const c=cvs.getContext('2d');

function pos(){
  const W=img.offsetWidth, H=img.offsetHeight;
  const pw=P.w*W, ph=P.h*H;
  const px=P.cx*W-pw/2, py=P.cy*H-ph/2;
  pill.style.cssText='position:absolute;left:'+px+'px;top:'+py+'px;width:'+pw+'px;height:'+ph+'px;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;padding:0 3%';
  pt.style.fontSize=Math.max(14,ph*0.75)+'px';
}
window.addEventListener('resize',pos);
img.complete?pos():img.addEventListener('load',pos);

msg.addEventListener('input',()=>{
  const v=msg.value.trim();
  if(v){pt.textContent=v;pt.classList.remove('ph')}
  else{pt.textContent='اكتب رسالتك أدناه…';pt.classList.add('ph')}
});

async function render(){
  const im=new Image();
  im.crossOrigin='anonymous';
  im.src=img.src;
  await new Promise(r=>{im.onload=r;if(im.complete)r()});
  cvs.width=im.naturalWidth;cvs.height=im.naturalHeight;
  c.drawImage(im,0,0);
  const text=msg.value.trim();
  if(!text)return;
  const NW=cvs.width,NH=cvs.height;
  const pw=P.w*NW,ph=P.h*NH,pcx=P.cx*NW,pcy=P.cy*NH;
  let fs=Math.round(ph*0.85);
  c.font='bold '+fs+'px "Noto Kufi Arabic",sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  c.direction='rtl';c.fillStyle='#1a1a2e';
  while(c.measureText(text).width>pw*0.87&&fs>8){
    fs--;c.font='bold '+fs+'px "Noto Kufi Arabic",sans-serif';
  }
  c.fillText(text,pcx,pcy);
}

document.getElementById('bPng').onclick=async function(){
  this.textContent='⏳';this.disabled=true;
  try{
    await render();
    const a=document.createElement('a');
    a.download='eid-card.png';a.href=cvs.toDataURL('image/png');
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert('Error: '+e.message)}
  finally{this.textContent='⬇ تحميل الكارت';this.disabled=false}
};

document.getElementById('bPdf').onclick=async function(){
  this.textContent='⏳';this.disabled=true;
  try{
    await render();
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const margin=10,pw=210-margin*2,ph=297-margin*2;
    const ratio=cvs.width/cvs.height;
    let iw=pw,ih=iw/ratio;
    if(ih>ph){ih=ph;iw=ih*ratio}
    const ox=(210-iw)/2,oy=(297-ih)/2;
    pdf.addImage(cvs.toDataURL('image/jpeg',0.95),'JPEG',ox,oy,iw,ih);
    pdf.save('eid-card.pdf');
  }catch(e){alert('Error: '+e.message)}
  finally{this.textContent='📄 تحميل PDF';this.disabled=false}
};

document.getElementById('bPrt').onclick=async function(){
  this.textContent='⏳';this.disabled=true;
  try{
    await render();
    const url=cvs.toDataURL('image/png');
    const w=window.open('','_blank','width=700,height=900');
    w.document.write('<html><head><style>*{margin:0;padding:0}body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff}img{max-width:100%;max-height:100vh}@page{margin:0}</style></head><body><img src="'+url+'"></body></html>');
    w.document.close();
  }catch(e){alert('Error: '+e.message)}
  finally{this.textContent='🖨 طباعة';this.disabled=false}
};
</script>
</body>
</html>
