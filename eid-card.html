<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>عيدكم مبارك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Base ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #0d1b3e, #050c1a);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 4rem;
  font-family: 'Cairo', sans-serif;
  color: #fdf8f0;
}

/* ── Page Title ── */
h1 {
  font-size: clamp(1rem, 3vw, 1.3rem);
  color: #e8d5a0;
  margin-bottom: 1.5rem;
  text-align: center;
  opacity: 0.9;
  animation: fadeDown 0.6s ease both;
}

/* ── Card Wrapper ── */
.wrap {
  position: relative;
  width: 100%;
  max-width: 460px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(201, 168, 76, 0.35),
    0 12px 50px rgba(0, 0, 0, 0.6);
  animation: fadeUp 0.7s ease both;
  transition: box-shadow 0.3s ease;
}

.wrap:hover {
  box-shadow:
    0 0 0 1px rgba(201, 168, 76, 0.55),
    0 18px 60px rgba(0, 0, 0, 0.7),
    0 0 30px rgba(201, 168, 76, 0.08);
}

.wrap img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  pointer-events: none;
}

/* ── Pill / White Text Box ── */
.pill {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  pointer-events: none;
  padding: 4% 4%;
  visibility: hidden;
}

.pill-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.pill span {
  font-family: 'Cairo', sans-serif;
  font-weight: 900;
  color: #ffffff;
  text-align: center;
  width: 100%;
  direction: auto;
  unicode-bidi: plaintext;
  line-height: 1.25;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  display: block;
  letter-spacing: -0.01em;
  transition: font-size 0.2s ease, opacity 0.25s ease;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern" 1, "liga" 1;
}

.pill span.ph {
  color: #9aa0b8;
  font-weight: 600;
  font-style: normal;
  opacity: 0.6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Controls Section ── */
.ctrl {
  margin-top: 1.4rem;
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  animation: fadeUp 0.8s 0.1s ease both;
}

label {
  font-size: 0.82rem;
  color: #e8d5a0;
  display: block;
  margin-bottom: 0.35rem;
  opacity: 0.85;
}

textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(201, 168, 76, 0.4);
  border-radius: 12px;
  padding: 0.75rem 1rem;
  color: #fdf8f0;
  font-family: 'Cairo', sans-serif;
  font-size: 0.95rem;
  min-height: 68px;
  resize: none;
  outline: none;
  direction: auto;
  unicode-bidi: plaintext;
  transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  line-height: 1.5;
}

textarea:focus {
  border-color: #c9a84c;
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
}

textarea::placeholder {
  color: rgba(253, 248, 240, 0.3);
}

/* ── Buttons ── */
.btns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.6rem;
}

button {
  padding: 0.72rem 0.4rem;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}

button::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0);
  transition: background 0.2s ease;
}

button:hover {
  opacity: 0.88;
  transform: translateY(-1px);
}

button:hover::after {
  background: rgba(255, 255, 255, 0.06);
}

button:active {
  transform: scale(0.96) translateY(0);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.b1 {
  background: linear-gradient(135deg, #c9a84c, #9a7428);
  color: #fff;
  box-shadow: 0 4px 14px rgba(201, 168, 76, 0.4);
}

.b1:hover:not(:disabled) {
  box-shadow: 0 6px 20px rgba(201, 168, 76, 0.55);
}

.b2 {
  background: linear-gradient(135deg, #c0392b, #7b241c);
  color: #fff;
  box-shadow: 0 4px 14px rgba(192, 57, 43, 0.4);
}

.b2:hover:not(:disabled) {
  box-shadow: 0 6px 20px rgba(192, 57, 43, 0.55);
}

.b3 {
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(201, 168, 76, 0.4);
  color: #e8d5a0;
}

.b3:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.13);
  border-color: rgba(201, 168, 76, 0.65);
}

canvas {
  display: none;
}

/* ── Keyframe Animations ── */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Responsive Mobile ── */
@media (max-width: 480px) {
  body {
    padding: 1.2rem 0.75rem 3rem;
  }

  .wrap {
    border-radius: 12px;
  }

  .ctrl {
    gap: 0.75rem;
  }

  button {
    font-size: 0.75rem;
    padding: 0.65rem 0.3rem;
  }

  h1 {
    margin-bottom: 1rem;
  }
}

@media (max-width: 360px) {
  .btns {
    grid-template-columns: 1fr;
  }

  button:first-child {
    grid-column: 1 / -1;
  }
}

/* ── Background Particle Canvas ── */
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Lift all content above canvas */
h1, .wrap, .ctrl {
  position: relative;
  z-index: 1;
}

/* ── Card shine sweep ── */
.card-shine {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(
    115deg,
    transparent 0%,
    transparent 40%,
    rgba(255,255,255,0.08) 50%,
    transparent 60%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: shineSweep 4s ease-in-out infinite;
}

@keyframes shineSweep {
  0%   { background-position: 200% 0; }
  50%  { background-position: -50% 0; }
  100% { background-position: 200% 0; }
}

/* ── Pill glow pulse ── */
.pill {
  animation: pillGlow 3s ease-in-out infinite;
}

@keyframes pillGlow {
  0%, 100% { filter: drop-shadow(0 0 0px rgba(201,168,76,0)); }
  50%       { filter: drop-shadow(0 0 8px rgba(201,168,76,0.55)); }
}

/* ── Card float ── */
.wrap {
  animation: fadeUp 0.7s ease both, cardFloat 6s ease-in-out 0.7s infinite;
}

@keyframes cardFloat {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-6px); }
}

/* ── Title shimmer text ── */
h1 {
  background: linear-gradient(90deg, #e8d5a0 0%, #fff5d6 40%, #c9a84c 60%, #e8d5a0 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeDown 0.6s ease both, textShimmer 4s linear 0.6s infinite;
}

@keyframes textShimmer {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}

/* ── Button sparkle on hover ── */
.b1 {
  animation: goldPulse 3s ease-in-out infinite;
}

@keyframes goldPulse {
  0%, 100% { box-shadow: 0 4px 14px rgba(201,168,76,0.4); }
  50%       { box-shadow: 0 4px 28px rgba(201,168,76,0.75), 0 0 0 2px rgba(201,168,76,0.2); }
}

/* ── Typed text pop-in ── */
.pill span:not(.ph) {
  animation: textPop 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes textPop {
  from { transform: scale(0.88); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

/* ── Crescent/star decorations ── */
.deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  font-size: 1.4rem;
  opacity: 0;
  animation: decoFloat linear infinite;
  user-select: none;
}

@keyframes decoFloat {
  0%   { transform: translateY(0)   rotate(0deg)   scale(0.6); opacity: 0; }
  10%  { opacity: 0.55; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-100vh) rotate(360deg) scale(1.1); opacity: 0; }
}


/* ── Inputs Card ── */
.inputs-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 18px;
  padding: 1.1rem 1.1rem 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
}

.inputs-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.input-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
  margin: 0.85rem 0;
}

.lbl-icon {
  font-size: 0.8rem;
}

label {
  font-size: 0.78rem;
  color: rgba(201,168,76,0.85);
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-bottom: 0;
  opacity: 1;
}

.input-wrap {
  position: relative;
}

input[type="text"] {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: 10px;
  padding: 0.65rem 1rem;
  color: #fdf8f0;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  outline: none;
  direction: rtl;
  unicode-bidi: plaintext;
  transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  letter-spacing: 0.01em;
}

input[type="text"]:focus {
  border-color: rgba(201,168,76,0.7);
  background: rgba(255,255,255,0.09);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.1), 0 2px 8px rgba(0,0,0,0.2);
}

input[type="text"]::placeholder {
  color: rgba(253,248,240,0.22);
  font-weight: 400;
}

input[type="text"]:not(:placeholder-shown) {
  border-color: rgba(201,168,76,0.5);
  background: rgba(255,255,255,0.08);
}

/* ── Two-line pill layout ── */
.pill-inner {
  flex-direction: column !important;
  gap: 2px;
}

.pill-name {
  font-family: 'Cairo', sans-serif;
  font-weight: 900;
  color: #ffffff;
  text-align: center;
  width: 100%;
  direction: auto;
  unicode-bidi: plaintext;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  transition: font-size 0.2s ease;
  line-height: 1.15;
}

.pill-job {
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
  width: 100%;
  direction: auto;
  unicode-bidi: plaintext;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  transition: font-size 0.2s ease;
  line-height: 1.15;
}

.pill-name.ph, .pill-job.ph {
  color: #9aa0b8;
  font-weight: 500;
  opacity: 0.5;
}

</style>
</head>

  <div class="pill" id="pill">
    <div class="pill-inner" id="pillInner">
      <span class="pill-name ph" id="ptName">الاسم</span>
      <span class="pill-job ph" id="ptJob">المسمى الوظيفي</span>
    </div>
  </div>
</div>
<div class="ctrl">
  <div class="inputs-card">
    <div class="input-group">
      <label for="msgName"><span class="lbl-icon">👤</span> الاسم الكريم</label>
      <div class="input-wrap">
        <input type="text" id="msgName" placeholder="اكتب اسمك هنا" autocomplete="off" maxlength="60"/>
      </div>
    </div>
    <div class="input-divider"></div>
    <div class="input-group">
      <label for="msgTitle"><span class="lbl-icon">💼</span> المسمى الوظيفي</label>
      <div class="input-wrap">
        <input type="text" id="msgTitle" placeholder="اكتب مسماك الوظيفي" autocomplete="off" maxlength="60"/>
      </div>
    </div>
  </div>
  <div class="btns">
    <button class="b1" id="bPng" style="grid-column:1/-1">⬇ تحميل الكارت</button>
  </div>
</div>
<canvas id="cvs"></canvas>

<script>
/* ════════════════════════════════════════════
   ANIMATIONS
   ════════════════════════════════════════════ */

/* ── Background star particles ── */
(function () {
  const bgCvs = document.getElementById('bgCanvas');
  const ctx   = bgCvs.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = bgCvs.width  = window.innerWidth;
    H = bgCvs.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 130; i++) {
    stars.push({
      x: Math.random() * 1,
      y: Math.random() * 1,
      r: Math.random() * 1.6 + 0.3,
      a: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.0003 + 0.00008,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      gold: Math.random() < 0.25
    });
  }

  const dust = [];
  for (let i = 0; i < 28; i++) {
    dust.push(spawnDust());
  }

  function spawnDust() {
    return {
      x: Math.random(),
      y: Math.random() * 1.2,
      r: Math.random() * 2.5 + 0.8,
      vy: -(Math.random() * 0.0006 + 0.0002),
      vx: (Math.random() - 0.5) * 0.0002,
      alpha: Math.random() * 0.5 + 0.15,
      fade: Math.random() * 0.002 + 0.0005
    };
  }

  function draw(ts) {
    ctx.clearRect(0, 0, W, H);

    stars.forEach(s => {
      s.twinkle += s.twinkleSpeed;
      const opacity = 0.3 + 0.55 * Math.abs(Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.gold
        ? `rgba(201,168,76,${opacity * 0.8})`
        : `rgba(220,230,255,${opacity})`;
      ctx.fill();
    });

    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.x += d.vx;
      d.y += d.vy;
      d.alpha -= d.fade;

      if (d.alpha <= 0 || d.y < -0.05) {
        dust[i] = spawnDust();
        dust[i].y = 1.05;
        continue;
      }

      const px = d.x * W, py = d.y * H, pr = d.r;
      ctx.save();
      ctx.globalAlpha = d.alpha;
      ctx.translate(px, py);
      ctx.fillStyle = '#c9a84c';
      ctx.beginPath();
      ctx.moveTo(0, -pr * 2.5);
      ctx.lineTo(pr * 0.4, -pr * 0.4);
      ctx.lineTo(pr * 2.5, 0);
      ctx.lineTo(pr * 0.4, pr * 0.4);
      ctx.lineTo(0, pr * 2.5);
      ctx.lineTo(-pr * 0.4, pr * 0.4);
      ctx.lineTo(-pr * 2.5, 0);
      ctx.lineTo(-pr * 0.4, -pr * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ── Floating emoji decorations (crescent + stars) ── */
(function () {
  const symbols = ['✦', '✧', '☽', '✦', '✧', '★', '✦', '✩'];

  function launch() {
    const el = document.createElement('span');
    el.className = 'deco';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    const left = Math.random() * 90 + 5;
    const dur  = Math.random() * 8 + 7;
    const delay = Math.random() * 5;
    el.style.cssText = `left:${left}vw; bottom:-5vh; font-size:${Math.random()*1.2+0.8}rem; animation-duration:${dur}s; animation-delay:${delay}s; color:${Math.random()<0.5?'#c9a84c':'#a0b0e0'};`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000);
  }

  for (let i = 0; i < 12; i++) launch();
  setInterval(launch, 1200);
})();

/* ── Sparkle burst when user types ── */
(function () {
  function burst(x, y) {
    for (let i = 0; i < 8; i++) {
      const el = document.createElement('span');
      const angle = (i / 8) * Math.PI * 2;
      const dist  = Math.random() * 40 + 20;
      const dx    = Math.cos(angle) * dist;
      const dy    = Math.sin(angle) * dist;
      el.style.cssText = `
        position:fixed; left:${x}px; top:${y}px;
        width:5px; height:5px; border-radius:50%;
        background:${Math.random()<0.6?'#c9a84c':'#fff8e1'};
        pointer-events:none; z-index:9999;
        transition: transform 0.55s ease-out, opacity 0.55s ease-out;
        transform: translate(-50%,-50%);
        opacity: 1;
      `;
      document.body.appendChild(el);
      requestAnimationFrame(() => {
        el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
        el.style.opacity   = '0';
      });
      setTimeout(() => el.remove(), 600);
    }
  }

  const nameInput  = document.getElementById('msgName');
  const titleInput = document.getElementById('msgTitle');
  let lastBurst = 0;

  function onInput(e) {
    const now = Date.now();
    if (now - lastBurst < 200) return;
    lastBurst = now;
    const rect = e.target.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  nameInput.addEventListener('input', onInput);
  titleInput.addEventListener('input', onInput);
})();

// ── Text position: below عيدكم مبارك with good spacing ──
const P = { cx: 0.73, cy: 0.50, w: 0.44, h: 0.10 };

const img       = document.getElementById('img');
const pill      = document.getElementById('pill');
const pillInner = document.getElementById('pillInner');
const ptName    = document.getElementById('ptName');
const ptJob     = document.getElementById('ptJob');
const msgName   = document.getElementById('msgName');
const msgTitle  = document.getElementById('msgTitle');
const cvs       = document.getElementById('cvs');
const c         = cvs.getContext('2d');

/* ── Dynamic font scaling for a single span ── */
function fitText(el, maxW, fs, minFs) {
  while (fs > minFs) {
    el.style.fontSize = fs + 'px';
    if (el.scrollWidth <= maxW) break;
    fs -= 0.5;
  }
  el.style.fontSize = fs + 'px';
}

/* ── Position pill overlay on top of the white rectangle ── */
function pos() {
  const W = img.offsetWidth;
  const H = img.offsetHeight;
  const pw = P.w * W;
  const ph = P.h * H;
  const px = P.cx * W - pw / 2;
  const py = P.cy * H - ph / 2;

  pill.style.left   = px + 'px';
  pill.style.top    = py + 'px';
  pill.style.width  = pw + 'px';
  pill.style.height = ph + 'px';

  const maxW   = pw - 12;
  const nameFs = Math.max(9, ph * 0.46);
  const jobFs  = Math.max(7, ph * 0.30);
  const minFs  = Math.max(7, ph * 0.18);

  fitText(ptName, maxW, nameFs, minFs);
  fitText(ptJob,  maxW, jobFs,  minFs);
}

window.addEventListener('resize', pos);
img.complete ? pos() : img.addEventListener('load', pos);

/* ── Live preview as user types ── */
function updatePill() {
  const name  = msgName.value.trim();
  const title = msgTitle.value.trim();

  if (name) {
    ptName.textContent = name;
    ptName.classList.remove('ph');
  } else {
    ptName.textContent = 'الاسم';
    ptName.classList.add('ph');
  }

  if (title) {
    ptJob.textContent = title;
    ptJob.classList.remove('ph');
  } else {
    ptJob.textContent = 'المسمى الوظيفي';
    ptJob.classList.add('ph');
  }

  requestAnimationFrame(pos);
}

msgName.addEventListener('input', updatePill);
msgTitle.addEventListener('input', updatePill);

/* ── Canvas render for download ── */
async function render() {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.src = img.src;
  await new Promise(r => { im.onload = r; if (im.complete) r(); });
  cvs.width  = im.naturalWidth;
  cvs.height = im.naturalHeight;
  c.drawImage(im, 0, 0);

  const name  = msgName.value.trim();
  const title = msgTitle.value.trim();
  if (!name && !title) return;

  const NW  = cvs.width, NH = cvs.height;
  const pw  = P.w  * NW;
  const ph  = P.h  * NH;
  const pcx = P.cx * NW;
  const pcy = P.cy * NH;

  c.textAlign    = 'center';
  c.textBaseline = 'middle';
  c.direction    = 'rtl';

  // Name — upper half of pill
  if (name) {
    let fs = Math.round(ph * 0.46);
    c.font = '900 ' + fs + 'px "Cairo",sans-serif';
    while (c.measureText(name).width > pw * 0.88 && fs > 8) {
      fs--;
      c.font = '900 ' + fs + 'px "Cairo",sans-serif';
    }
    c.fillStyle = '#ffffff';
    c.fillText(name, pcx, pcy - ph * 0.18);
  }

  // Title — lower half of pill
  if (title) {
    let fs2 = Math.round(ph * 0.30);
    c.font = '700 ' + fs2 + 'px "Cairo",sans-serif';
    while (c.measureText(title).width > pw * 0.88 && fs2 > 7) {
      fs2--;
      c.font = '700 ' + fs2 + 'px "Cairo",sans-serif';
    }
    c.fillStyle = '#ffffff';
    c.fillText(title, pcx, pcy + ph * 0.22);
  }
}

/* ── Download PNG ── */
document.getElementById('bPng').onclick = async function () {
  this.textContent = '⏳';
  this.disabled = true;
  try {
    await render();
    const a = document.createElement('a');
    a.download = 'eid-card.png';
    a.href = cvs.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    this.textContent = '⬇ تحميل الكارت';
    this.disabled = false;
  }
};
</script>
